<section>
  <h2>Lista osób</h2>

  <button routerLink="/add">Dodaj nową osobę</button>



  <ul>
    @for (person of persons; track $index) {
      <li>
        <strong>{{ person.firstName }} {{ person.familyName }}</strong>
        (wiek: {{ person.age || 'brak' }})
      
        |
        <a [routerLink]="['/details', person.id]">szczegóły</a>
        |
        <a href="#" (click)="delete(person.id!); $event.preventDefault()">usuń</a>
      </li>
    } @empty {
      <li>Brak zapisanych osób.</li>
    }
  </ul>
</section>
